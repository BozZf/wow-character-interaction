spring.application.name=wow-character-interaction

# Gemini Integration Config
gemini.api.url=http://localhost
gemini.api.model=test-model
gemini.api.key=unused-test-key

# PostGreSQL Config
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Config
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Flyway Config
spring.flyway.baseline-on-migrate=true

# Docker Test Config
server.port=8888

# JWT Config
jwt.secret.key=local-test-signing-key
jwt.token.expire-length=18000000

# Security Config
pass.crypt.secret=local-test-password-pepper
spring.flyway.placeholders.testPasswordPepper=${pass.crypt.secret}
