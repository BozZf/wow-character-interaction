spring.application.name=wow-character-interaction

# Gemini Integration Config
gemini.api.url=https://generativelanguage.googleapis.com
gemini.api.model=${GEMINI_MODEL:gemini-3.5-flash}
gemini.api.key=${GEMINI_API_KEY}

# PostGreSQL Config
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Config
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Flyway Config
spring.flyway.baseline-on-migrate=true

# JWT Config
jwt.secret.key=${JWT_SECRET_KEY}
jwt.token.expire-length=18000000

# Security Config
pass.crypt.secret=${PASS_CRYPT_SECRET}
